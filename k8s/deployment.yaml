apiVersion: apps/v1
kind: Deployment
metadata:
  name: secops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secops-app
  template:
    metadata:
      labels:
        app: secops-app
    spec:
      containers:
      - name: secops-app
        image: secops-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: secops-app-service
spec:
  type: NodePort
  selector:
    app: secops-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
