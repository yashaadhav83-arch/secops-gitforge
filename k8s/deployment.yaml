apiVersion: apps/v1
kind: Deployment
metadata:
  name: secops-app
  namespace: secops
  labels:
    app: secops-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: secops-app
  template:
    metadata:
      labels:
        app: secops-app
      annotations:
        checkov.io/skip1: CKV_K8S_43=Allow image tag for local Kind/Jenkins lab pipeline
        checkov.io/skip2: CKV_K8S_15=Allow IfNotPresent pull policy for local Kind cluster lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secops-app
          image: secops-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: secops-app-service
  namespace: secops
  labels:
    app: secops-app
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: secops-app
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secops-app-netpol
  namespace: secops
spec:
  podSelector:
    matchLabels:
      app: secops-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secops
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - {}
